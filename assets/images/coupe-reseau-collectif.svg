<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Coupe technique d'un réseau de chauffage collectif d'immeuble</title>
  <desc id="desc">Schéma en coupe montrant le réseau de chaleur urbain, la sous-station, les pompes, les colonnes montantes, les radiateurs de logements, le départ chaud et le retour.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6f2"/>
      <stop offset="1" stop-color="#e5e0d8"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1826"/>
      <stop offset="1" stop-color="#17283a"/>
    </linearGradient>
    <pattern id="stone" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M0 57.5H58M57.5 0V58" fill="none" stroke="#d7d1c7" stroke-width="1"/>
      <path d="M16 0v58M42 0v58M0 24h58" fill="none" stroke="#e5e0d8" stroke-width=".7"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#07111f" flood-opacity=".18"/>
    </filter>
    <style>
      .bg{fill:url(#paper)}
      .ink{fill:#142235}
      .muted{fill:#66707a}
      .fine{stroke:#9ca2a7;stroke-width:1.1;fill:none}
      .wall{fill:#f0eee9;stroke:#b9b0a3;stroke-width:1.2}
      .cut{fill:#e0d9ce}
      .glass{fill:#e9f0f2;stroke:#9aa7ad;stroke-width:1}
      .floor{stroke:#b9b0a3;stroke-width:3}
      .supply{stroke:#7d2f2b;stroke-width:10;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .return{stroke:#2f536d;stroke-width:10;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .supplyThin{stroke:#7d2f2b;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .returnThin{stroke:#2f536d;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .pipeMark{stroke:#f7f6f2;stroke-width:2;opacity:.7}
      .equip{fill:#f8f7f4;stroke:#87909a;stroke-width:1.4}
      .equipDark{fill:#17283a;stroke:#2f3d4d;stroke-width:1.4}
      .gold{fill:#a98b4c}
      .label{font: 500 21px Arial, sans-serif; letter-spacing:0; fill:#142235}
      .small{font: 500 15px Arial, sans-serif; letter-spacing:0; fill:#5f6872}
      .micro{font: 500 12px Arial, sans-serif; letter-spacing:0; fill:#69727b}
      .tag{fill:#f8f7f4;stroke:#c6beb3;stroke-width:1}
      .tagText{font: 600 13px Arial, sans-serif; letter-spacing:0; fill:#263544}
    </style>
  </defs>

  <rect class="bg" width="1440" height="980"/>
  <path d="M88 128h1264v724H88z" fill="#ffffff" opacity=".55"/>
  <path d="M88 128h1264v724H88z" fill="url(#stone)" opacity=".55"/>

  <g filter="url(#shadow)">
    <path class="wall" d="M240 132h716v720H240z"/>
    <path class="cut" d="M240 132h44v720h-44z"/>
    <path class="cut" d="M956 132h36v720h-36z"/>
    <path class="cut" d="M240 792h752v60H240z"/>
    <path class="floor" d="M240 252h752M240 372h752M240 492h752M240 612h752M240 732h752"/>

    <g opacity=".92">
      <rect class="glass" x="322" y="166" width="78" height="54"/>
      <rect class="glass" x="508" y="166" width="78" height="54"/>
      <rect class="glass" x="694" y="166" width="78" height="54"/>
      <rect class="glass" x="322" y="286" width="78" height="54"/>
      <rect class="glass" x="508" y="286" width="78" height="54"/>
      <rect class="glass" x="694" y="286" width="78" height="54"/>
      <rect class="glass" x="322" y="406" width="78" height="54"/>
      <rect class="glass" x="508" y="406" width="78" height="54"/>
      <rect class="glass" x="694" y="406" width="78" height="54"/>
      <rect class="glass" x="322" y="526" width="78" height="54"/>
      <rect class="glass" x="508" y="526" width="78" height="54"/>
      <rect class="glass" x="694" y="526" width="78" height="54"/>
      <rect class="glass" x="322" y="646" width="78" height="54"/>
      <rect class="glass" x="508" y="646" width="78" height="54"/>
      <rect class="glass" x="694" y="646" width="78" height="54"/>
    </g>

    <path class="fine" d="M832 132v660M292 132v660M452 132v660M636 132v660"/>
    <path class="supply" d="M856 805V198"/>
    <path class="return" d="M900 805V198"/>

    <g>
      <path class="supplyThin" d="M856 208H790"/>
      <path class="returnThin" d="M900 226H790"/>
      <path class="supplyThin" d="M856 328H790"/>
      <path class="returnThin" d="M900 346H790"/>
      <path class="supplyThin" d="M856 448H790"/>
      <path class="returnThin" d="M900 466H790"/>
      <path class="supplyThin" d="M856 568H790"/>
      <path class="returnThin" d="M900 586H790"/>
      <path class="supplyThin" d="M856 688H790"/>
      <path class="returnThin" d="M900 706H790"/>
    </g>

    <g fill="none" stroke="#53606a" stroke-width="3" stroke-linecap="round">
      <path d="M640 204h78v20h-78zM660 210v8M678 210v8M696 210v8"/>
      <path d="M640 324h78v20h-78zM660 330v8M678 330v8M696 330v8"/>
      <path d="M640 444h78v20h-78zM660 450v8M678 450v8M696 450v8"/>
      <path d="M640 564h78v20h-78zM660 570v8M678 570v8M696 570v8"/>
      <path d="M640 684h78v20h-78zM660 690v8M678 690v8M696 690v8"/>
    </g>

    <g>
      <rect class="equipDark" x="326" y="766" width="518" height="66" rx="5"/>
      <rect class="equip" x="368" y="786" width="92" height="30" rx="3"/>
      <rect class="equip" x="482" y="776" width="78" height="48" rx="4"/>
      <rect class="equip" x="584" y="778" width="86" height="44" rx="4"/>
      <circle class="equip" cx="718" cy="800" r="24"/>
      <circle class="equip" cx="778" cy="800" r="24"/>
      <path class="supply" d="M110 808H368M560 800H856"/>
      <path class="return" d="M110 840H482M670 822H900"/>
      <path class="pipeMark" d="M174 808v32M232 808v32M290 808v32"/>
      <path class="pipeMark" d="M588 786l-28 28M614 786l-28 28M640 786l-28 28"/>
      <path class="pipeMark" d="M718 776v48M778 776v48"/>
      <rect class="tag" x="374" y="718" width="160" height="31" rx="4"/>
      <text class="tagText" x="390" y="739">Sous-station</text>
      <rect class="tag" x="574" y="718" width="168" height="31" rx="4"/>
      <text class="tagText" x="590" y="739">Echangeur</text>
      <rect class="tag" x="760" y="718" width="132" height="31" rx="4"/>
      <text class="tagText" x="776" y="739">Pompes</text>
    </g>
  </g>

  <g>
    <path class="supply" d="M80 808H110"/>
    <path class="return" d="M80 840H110"/>
    <text class="label" x="84" y="748">Raccordement réseau de chaleur</text>
    <text class="small" x="84" y="773">Arrivee primaire, comptage et separation hydraulique</text>
    <path class="fine" d="M116 784v-24h218"/>
  </g>

  <g>
    <text class="label" x="1038" y="188">Colonne montante collective</text>
    <text class="small" x="1038" y="216">Distribution verticale vers les logements</text>
    <path class="fine" d="M1004 216h-84"/>
    <rect class="tag" x="1038" y="260" width="160" height="31" rx="4"/>
    <text class="tagText" x="1054" y="281">Depart chaud</text>
    <path class="supplyThin" d="M1214 276h86"/>
    <rect class="tag" x="1038" y="304" width="160" height="31" rx="4"/>
    <text class="tagText" x="1054" y="325">Retour réseau</text>
    <path class="returnThin" d="M1214 320h86"/>
  </g>

  <g>
    <text class="label" x="1038" y="430">Points de controle Sig'Om</text>
    <text class="small" x="1038" y="462">Audit des pertes, équilibrage, calorifugeage, régulation</text>
    <path class="fine" d="M1038 486h232M1038 524h232M1038 562h232"/>
    <circle class="gold" cx="1020" cy="486" r="5"/>
    <circle class="gold" cx="1020" cy="524" r="5"/>
    <circle class="gold" cx="1020" cy="562" r="5"/>
    <text class="small" x="1038" y="492">Lecture des schemas et releves sur site</text>
    <text class="small" x="1038" y="530">Verification organes, circulateurs, vannes</text>
    <text class="small" x="1038" y="568">Scénario PPPT, DTG ou audit énergétique</text>
  </g>

  <g opacity=".9">
    <path class="fine" d="M796 214c-52 0-68 20-78 20M796 334c-52 0-68 20-78 20M796 454c-52 0-68 20-78 20M796 574c-52 0-68 20-78 20M796 694c-52 0-68 20-78 20"/>
    <circle class="gold" cx="856" cy="208" r="6"/>
    <circle class="gold" cx="900" cy="226" r="6"/>
    <circle class="gold" cx="856" cy="448" r="6"/>
    <circle class="gold" cx="900" cy="466" r="6"/>
    <circle class="gold" cx="856" cy="688" r="6"/>
    <circle class="gold" cx="900" cy="706" r="6"/>
  </g>

  <g>
    <text class="micro" x="94" y="910">Schéma de principe, non contractuel. Les éléments représentés varient selon le bâtiment, le mode de comptage, le réseau de chaleur et les organes existants.</text>
    <text class="micro" x="94" y="934">Coupe vectorielle créée pour Sig'Om afin d'illustrer l'analyse d'un réseau collectif d'immeuble existant.</text>
  </g>
</svg>
