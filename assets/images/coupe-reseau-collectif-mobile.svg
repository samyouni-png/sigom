<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">Coupe mobile d'un réseau de chauffage collectif</title>
  <desc id="desc">Schéma vertical simplifié d'un immeuble collectif avec sous-station, départ chaud, retour réseau, colonne montante et logements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6f2"/>
      <stop offset="1" stop-color="#e4ded3"/>
    </linearGradient>
    <style>
      .bg{fill:url(#bg)}
      .wall{fill:#f2efe8;stroke:#bbb2a7;stroke-width:1.4}
      .cut{fill:#ddd5ca}
      .floor{stroke:#b7aea3;stroke-width:2}
      .fine{stroke:#989fa5;stroke-width:1;fill:none}
      .supply{stroke:#7d2f2b;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .return{stroke:#2f536d;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .supplyThin{stroke:#7d2f2b;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .returnThin{stroke:#2f536d;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .equip{fill:#f9f8f5;stroke:#828c95;stroke-width:1.3}
      .dark{fill:#142235}
      .gold{fill:#a98b4c}
      .label{font:600 21px Arial, sans-serif;letter-spacing:0;fill:#142235}
      .small{font:500 15px Arial, sans-serif;letter-spacing:0;fill:#5f6872}
      .micro{font:500 12px Arial, sans-serif;letter-spacing:0;fill:#69727b}
      .tag{fill:#fffdfa;stroke:#c7beb4;stroke-width:1}
      .tagText{font:700 13px Arial, sans-serif;letter-spacing:0;fill:#203142}
    </style>
  </defs>

  <rect class="bg" width="640" height="900"/>

  <text class="label" x="42" y="56">Réseau collectif d'immeuble</text>
  <text class="small" x="42" y="82">Lecture simplifiée : sous-station, distribution, points de contrôle.</text>

  <g>
    <path class="wall" d="M84 116h344v560H84z"/>
    <path class="cut" d="M84 116h32v560H84z"/>
    <path class="floor" d="M84 214h344M84 312h344M84 410h344M84 508h344M84 606h344"/>
    <path class="fine" d="M128 116v560M318 116v560"/>

    <g>
      <rect class="equip" x="158" y="145" width="86" height="34" rx="2"/>
      <rect class="equip" x="158" y="243" width="86" height="34" rx="2"/>
      <rect class="equip" x="158" y="341" width="86" height="34" rx="2"/>
      <rect class="equip" x="158" y="439" width="86" height="34" rx="2"/>
      <rect class="equip" x="158" y="537" width="86" height="34" rx="2"/>
    </g>

    <path class="supply" d="M340 640V154"/>
    <path class="return" d="M380 640V154"/>
    <path class="supplyThin" d="M340 164H252"/>
    <path class="returnThin" d="M380 184H252"/>
    <path class="supplyThin" d="M340 262H252"/>
    <path class="returnThin" d="M380 282H252"/>
    <path class="supplyThin" d="M340 360H252"/>
    <path class="returnThin" d="M380 380H252"/>
    <path class="supplyThin" d="M340 458H252"/>
    <path class="returnThin" d="M380 478H252"/>
    <path class="supplyThin" d="M340 556H252"/>
    <path class="returnThin" d="M380 576H252"/>

    <rect class="dark" x="116" y="640" width="312" height="36" rx="4"/>
    <rect class="equip" x="144" y="649" width="74" height="18" rx="2"/>
    <rect class="equip" x="232" y="645" width="60" height="26" rx="3"/>
    <circle class="equip" cx="322" cy="658" r="16"/>
    <circle class="equip" cx="366" cy="658" r="16"/>
  </g>

  <g>
    <path class="supply" d="M42 704H284V660"/>
    <path class="return" d="M42 736H366V674"/>
    <rect class="tag" x="42" y="642" width="172" height="30" rx="4"/>
    <text class="tagText" x="56" y="663">Sous-station</text>
    <text class="small" x="42" y="770">Réseau de chaleur urbain ou production collective.</text>
  </g>

  <g>
    <rect class="tag" x="442" y="154" width="152" height="30" rx="4"/>
    <text class="tagText" x="456" y="175">Départ chaud</text>
    <path class="supplyThin" d="M430 169h-86"/>
    <rect class="tag" x="442" y="198" width="152" height="30" rx="4"/>
    <text class="tagText" x="456" y="219">Retour réseau</text>
    <path class="returnThin" d="M430 213h-50"/>

    <text class="label" x="442" y="306">Contrôles</text>
    <circle class="gold" cx="450" cy="338" r="5"/>
    <text class="small" x="466" y="343">Équilibrage</text>
    <circle class="gold" cx="450" cy="374" r="5"/>
    <text class="small" x="466" y="379">Calorifugeage</text>
    <circle class="gold" cx="450" cy="410" r="5"/>
    <text class="small" x="466" y="415">Régulation</text>
    <circle class="gold" cx="450" cy="446" r="5"/>
    <text class="small" x="466" y="451">Comptage</text>
  </g>

  <text class="micro" x="42" y="838">Schéma de principe, non contractuel. Les organes varient selon le bâtiment existant.</text>
  <text class="micro" x="42" y="862">Coupe vectorielle créée pour illustrer l'analyse technique Sig'Om.</text>
</svg>
